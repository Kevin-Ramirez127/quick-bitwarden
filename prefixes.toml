# quick-bitwarden query prefixes.
#
# Type one of these prefixes in the search field and press Enter to run it.
# The leading ">" marks them as commands rather than item names.
#
# When the daemon starts it points the actions below at the running
# quick-bitwarden executable, so they work no matter how it was started.

[[prefix]]
prefix = ">sync"
shell = "{qbw} sync"
hint = "Sync the vault"

[[prefix]]
prefix = ">lock"
shell = "{qbw} lock"
hint = "Lock the vault"

[[prefix]]
prefix = ">hide items"
shell = "{qbw} hide-items"
hint = "Hide the item list until a 3+ character search"

[[prefix]]
prefix = ">show items"
shell = "{qbw} show-items"
hint = "Show the full item list"
