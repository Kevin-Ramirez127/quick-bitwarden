# quick-bitwarden configuration.
#
# One file holds both kinds of entries:
#
#   prefix entries     queries that start with ">" are commands, not item
#                      names. Type the prefix in the search field and press
#                      Enter to run it.
#   shortcut entries   key bindings for the search window. `pick = "<tag>"`
#                      picks the highlighted item, tagged for quick-bitwarden
#                      ("username" copies the username instead of the
#                      password); the r-modals targets option/command/shell
#                      also work here.
#
# `{exe}` is replaced with the running quick-bitwarden executable when the
# file is created (and in built-in entries appended on upgrade), so the actions
# work no matter how the binary was started.

# --- Prefixes ---------------------------------------------------------------

[[prefix]]
prefix = ">sync"
shell = "{exe} sync"
hint = "Sync the vault"

[[prefix]]
prefix = ">lock"
shell = "{exe} lock"
hint = "Lock the vault"

[[prefix]]
prefix = ">hide items"
shell = "{exe} hide-items"
hint = "Hide the item list until a 3+ character search"

[[prefix]]
prefix = ">show items"
shell = "{exe} show-items"
hint = "Show the full item list"

[[prefix]]
prefix = ">restart"
shell = "{exe} restart"
hint = "Restart the daemon"

[[prefix]]
prefix = ">stop"
shell = "{exe} stop"
hint = "Stop the daemon"

# --- Shortcuts --------------------------------------------------------------

[[shortcut]]
key = "Shift+Enter"
pick = "username"
