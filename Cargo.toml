[package]
name = "quick-bitwarden"
version = "0.2.0"
edition = "2021"
description = "A quick way to copy your Bitwarden passwords, backed by a daemon and an r-modals picker"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kevin-Ramirez127/quick-bitwarden"
readme = "README.md"

[[bin]]
name = "quick-bitwarden"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The view/UI layer. Pinned to the revision with `min_match_chars`
# (hidden item list until the query is long enough) and the `pick` shortcut
# target (Shift+Enter picks the row tagged `username`).
r-modals = { git = "https://github.com/Kevin-Ramirez127/r-modals", rev = "44e9c348e4790a5116c22992a40eeee8b8ab0033" }

# Ship a small, fast binary: `strip` + LTO + `panic = "abort"` cut the size
# substantially, and every dialog is a short-lived child process, so a smaller
# image means less work to map on each spawn.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

