[package]
name = "quick-bitwarden"
version = "0.2.0"
edition = "2021"
description = "A quick way to copy your Bitwarden passwords, backed by a daemon and an r-modals picker"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kevin-Ramirez127/quick-bitwarden"
readme = "README.md"

[[bin]]
name = "quick-bitwarden"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The view/UI layer. Pinned to the revision with the dialog backend,
# `{exe}` config expansion, and the Hack fallback that lets the ↵/⇥ hint
# arrows render (the default proportional font has no glyphs for them).
r-modals = { git = "https://github.com/Kevin-Ramirez127/r-modals", rev = "cd472b0c07ed5f7f4d7dab0684dc2885ea559eb6" }

# Ship a small, fast binary: `strip` + LTO + `panic = "abort"` cut the size
# substantially, and every dialog is a short-lived child process, so a smaller
# image means less work to map on each spawn.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

